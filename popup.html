<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; width: 340px; margin: 0; padding: 12px; }
    h1 { font-size: 13px; margin: 0 0 8px; }
    .row { display: flex; gap: 6px; margin-bottom: 8px; }
    button { flex: 1; padding: 7px; font-size: 12px; cursor: pointer;
             border: 1px solid #888; border-radius: 6px; background: #f5f5f5; }
    button:hover { background: #e8e8e8; }
    #status { margin-bottom: 8px; color: #2a7; min-height: 1em; font-size: 12px; }
    .loghead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .loghead b { font-size: 12px; }
    #stats { color: #666; font-size: 11px; }
    #log { height: 220px; overflow-y: auto; background: #1e1e1e; color: #d4d4d4;
           font: 11px/1.45 ui-monospace, Consolas, monospace; padding: 6px;
           border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
    .hit  { color: #6a9955; }
    .miss { color: #ce9178; }
    .err  { color: #f48771; }
  </style>
</head>
<body>
  <h1>Loaded Price Injector</h1>
  <div class="row">
    <button id="clear">Clear cache &amp; reload</button>
    <button id="clearlog">Clear log</button>
  </div>
  <div id="status"></div>
  <div class="loghead"><b>Live log</b><span id="stats"></span></div>
  <div id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
